[project]
name = "cardiomind"
version = "1.0.0"
description = "CardioMind AI — Heart Disease Risk Prediction System"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",
    "shap==0.45.1",
    "scipy==1.13.1",
    "joblib==1.4.2",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "reportlab==4.2.0",
    "sse-starlette==2.1.0",
    "jinja2==3.1.4",
    "requests==2.32.3",
    "websockets==12.0",
    "python-multipart==0.0.9",
    "google-generativeai==0.7.0",
    "PyJWT==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "motor==3.7.1",
    "beautifulsoup4==4.15.0",
    "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
