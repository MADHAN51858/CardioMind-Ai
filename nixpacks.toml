# Nixpacks configuration for CardioMind Python Backend
providers = ["python"]

[phases.setup]
nixPkgs = ["python39", "gcc", "gfortran"]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
